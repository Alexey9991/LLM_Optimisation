replaceme_repo: .
runs: /home/tnn/LLM_optimisatoin/runs_reproduce
control_run: llama-3-8b-repo-nf4
profiles_dir: profiles

model_path: unsloth/llama-3-8b
n_layers: 32
precision: nf4
seed: 42

calib_size: 128
calib_max_length: 256
calib_batch_size: 2
profile_batch_size: 1
profile_answer_only_loss: true

alpha_act: 1.0
alpha_grad: 0.5
alpha_reg: 0.0
identity_blend_threshold: 0.15
norm_ratio_limit: 3.1

lora_rank: 8
lora_alpha: 16
lora_target_modules: [gate_proj, up_proj, down_proj]
train_batch_size: 2
train_grad_accum: 4
train_limit: null
train_max_length: 384
train_learning_rate: 2.0e-4
train_epochs: 1.0
train_warmup_steps: 20
train_gradient_checkpointing: true
train_optim: paged_adamw_8bit
train_lm_head_on_second_gpu: false

eval_dataset: gsm8k
eval_batch_size: 8
eval_max_new_tokens: 256
eval_limit: null

gap: 1

# blocks are 1-based (start, end); one of: blocks, lengths, top1_length
experiments:
  - name: llama-3-8b-repo-nf4
    top1_length: 8
    restore_without_T: true
    eval_pruned: true
  - name: llama-3-8b-repo-numA2-nf4
    lengths: [4, 4]
  - name: llama-3-8b-repo-numA3-nf4
    lengths: [3, 3, 2]
  - name: llama-3-8b-repo-numA4-nf4
    lengths: [2, 2, 2, 2]
  - name: llama-3-8b-numA4-shift19-nf4
    blocks: [[19, 21], [22, 24], [25, 27], [28, 30]]
  - name: llama-3-8b-numA4-shift20-nf4
    blocks: [[20, 22], [23, 25], [26, 28], [29, 31]]
